name: Combined testing Linux release

on:
  push:
    branches: [integration/combined-testing]

permissions:
  contents: read

concurrency:
  group: combined-testing-release
  cancel-in-progress: true

jobs:
  integrate:
    if: github.repository == 'samwathegreat/graywolf'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge pinned approved feature heads
        id: merge
        run: |
          set -euo pipefail
          git config user.name samwathegreat
          git config user.email samwathegreat@users.noreply.github.com
          heads=$(sed -nE 's/.*\| ([0-9a-f]{40}) \|/\1/p' docs/combined-testing.md)
          test "$(printf '%s\n' "$heads" | wc -l)" -eq 13
          while read -r head; do
            if ! git merge-base --is-ancestor "$head" HEAD; then
              git fetch origin "$head"
              git merge --no-ff --no-edit "$head"
            fi
          done <<< "$heads"
          # Every row of the published manifest must be present in the build.
          while read -r head; do
            git merge-base --is-ancestor "$head" HEAD
          done <<< "$heads"
          bash -n scripts/integration/package-linux.sh scripts/integration/package-arm64.sh
          # A normal push refuses concurrent edits; never force the branch.
          git push origin HEAD:refs/heads/integration/combined-testing
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          # GITHUB_TOKEN pushes do not trigger a second run. Build this SHA below.
  validate-build:
    needs: integrate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    if: github.repository == 'samwathegreat/graywolf'
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    timeout-minutes: 45
    env:
      # Keep caches outside root's home so the unprivileged test user can
      # traverse them after ownership is transferred.
      GOCACHE: /tmp/graywolf-ci-go-cache
      GOMODCACHE: /tmp/graywolf-ci-go-modules
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native Bookworm build tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl build-essential pkg-config libasound2-dev protobuf-compiler cmake python3 xz-utils zstd gh jq
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Stamp paired components
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "${{ needs.integrate.outputs.sha }}"
          echo "GRAYWOLF_VERSION=$(cat INTEGRATION_VERSION)" >> "$GITHUB_ENV"
          echo "GRAYWOLF_GIT_COMMIT=${commit:0:8}" >> "$GITHUB_ENV"
      - name: Web tests, API client check and production build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run api:check
          npm run build
      - name: Generated API and Go regression checks
        run: |
          mkdir -p scratch/bin
          GOBIN="$(pwd)/scratch/bin" go install github.com/swaggo/swag/cmd/swag@v1.16.4
          make docs-check docs-lint api-client-check
          cmp pkg/webapi/docs/gen/swagger.json docs/handbook/openapi.json
          cmp pkg/webapi/docs/gen/swagger.yaml docs/handbook/openapi.yaml
          go vet ./...
          GOOS=linux GOARCH=arm GOARM=6 go vet ./...
          # Root bypasses chmod-based permission checks. Exercise the unchanged
          # suite as an ordinary user, with the same toolchain/module/cache paths.
          useradd --create-home --shell /bin/bash ci-test
          go_cache=$(go env GOCACHE)
          go_modcache=$(go env GOMODCACHE)
          chown -R ci-test:ci-test "$GITHUB_WORKSPACE" "$go_cache" "$go_modcache"
          runuser -u ci-test -- env HOME=/home/ci-test GOCACHE="$go_cache" GOMODCACHE="$go_modcache" go test -race ./...
      - name: Modem and serial PTT regression checks
        run: |
          cargo check --workspace --locked
          cargo clippy --workspace --locked -- -D warnings
          cargo test --release --locked --lib fx25
          cargo test --release --locked --lib il2p
          cargo test --release --locked --lib ptt
          cargo test --release --locked --lib audio::playback
          cargo test --release --locked --lib output_presentation_uses_last_mono_sample_position_in_stereo_all_formats
          cargo build --release --locked --bin graywolf-modem --example fx25_audio
          bash scripts/test_serial_ptt_sim.sh
      - name: Independent pinned Dire Wolf interoperability
        run: |
          git clone https://github.com/wb2osz/direwolf.git /tmp/direwolf-reference
          git -C /tmp/direwolf-reference checkout --detach eda1383f5fa9d8ba3cb27f99db1d2c79494404c9
          cmake -S /tmp/direwolf-reference -B /tmp/direwolf-reference/build
          cmake --build /tmp/direwolf-reference/build --target gen_packets atest -j2
          GRAYWOLF_FX25_TOOL="$PWD/target/release/examples/fx25_audio" python3 scripts/fx25/interop.py /tmp/direwolf-reference
      - name: Build and verify paired Linux application
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          cp target/release/graywolf-modem bin/
          go build -trimpath -buildvcs=false -ldflags="-s -w -X main.Version=$GRAYWOLF_VERSION -X main.GitCommit=$GRAYWOLF_GIT_COMMIT" -o bin/graywolf ./cmd/graywolf
          bin/graywolf version | tee /tmp/go-version.txt
          bin/graywolf-modem --version | tee /tmp/modem-version.txt
          grep -F "v$GRAYWOLF_VERSION-$GRAYWOLF_GIT_COMMIT" /tmp/go-version.txt
          grep -F "v$GRAYWOLF_VERSION-$GRAYWOLF_GIT_COMMIT" /tmp/modem-version.txt
          scripts/integration/package-linux.sh ${{ matrix.arch }} bin dist-combined
          dpkg-deb --info dist-combined/*.deb
          dpkg-deb --contents dist-combined/*.deb
          git diff --exit-code
      - uses: actions/upload-artifact@v5
        with:
          name: combined-linux-${{ matrix.arch }}
          path: dist-combined/
          retention-days: 14

  publish:
    if: github.repository == 'samwathegreat/graywolf'
    needs: [integrate, validate-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: combined-linux-*
          path: artifacts
      - name: Verify and collect both architectures
        run: |
          set -euo pipefail
          version=$(cat INTEGRATION_VERSION)
          mkdir -p dist-combined
          for arch in arm64 amd64; do
            (cd "artifacts/combined-linux-$arch" && sha256sum -c checksums.txt)
            cp artifacts/combined-linux-$arch/*.deb artifacts/combined-linux-$arch/*_linux_*.tar.gz artifacts/combined-linux-$arch/BUILD-*.txt dist-combined/
          done
          for shared in "graywolf_${version}_source.tar.gz" RELEASE_NOTES.md; do
            cmp "artifacts/combined-linux-arm64/$shared" "artifacts/combined-linux-amd64/$shared"
            cp "artifacts/combined-linux-arm64/$shared" dist-combined/
          done
          (cd dist-combined && sha256sum * > checksums.txt && sha256sum -c checksums.txt)
      - name: Publish complete fork test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(cat INTEGRATION_VERSION)"
          # Assemble both architectures before publishing the complete fork test release.
          gh release create "$tag" dist-combined/* --repo "$GITHUB_REPOSITORY" --target "${{ needs.integrate.outputs.sha }}" --draft --title "Graywolf $(cat INTEGRATION_VERSION) - combined testing (Linux ARM64 and x86_64)" --notes-file RELEASE_NOTES.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
